<div class="app-shell">
  <header class="app-shell__topbar">
    <a class="app-shell__brandlink" routerLink="/">
      <span class="app-shell__logo" aria-hidden="true">◈</span>
      <h1 class="app-shell__brand">{{ brand() }}</h1>
    </a>

    @if (onboarded()) {
      <a class="app-shell__tamer" routerLink="/profile" aria-label="Your tamer profile">
        <span class="app-shell__bits" title="Bits">
          <span aria-hidden="true">💠</span>{{ bitsLabel() }}
        </span>
        <span class="app-shell__rank">Lv {{ rank().level }}</span>
        <digi-tamer-avatar [seed]="profile().avatarSeed" [name]="profile().tamerName" [size]="34" />
      </a>
    }
  </header>

  <div class="app-shell__body">
    <aside class="app-shell__sidebar">
      <app-sidebar />
    </aside>

    <main class="app-shell__content">
      <router-outlet />

      <footer class="app-shell__footer">
        <p>
          This is a fan-made project using public
          <a href="https://digi-api.com/" target="_blank" rel="noopener noreferrer">DAPI</a> data.
          Digimon and related media are trademarks of Bandai. This project is not affiliated with or
          endorsed by Bandai.
        </p>
      </footer>
    </main>
  </div>

  <app-bottom-nav />
</div>
